study:
  name: autoresearch_resnext_decision_256x8_dfr30_axial_margin_trigger
  phase: main
  base_config: configs/autoresearch_formal_resnext_decision_256x8.yaml
  study_root: runs/optuna_main_autoloop/iter_0010_20260423_074115
  direction: maximize
  n_trials: 4
  timeout_minutes: 360
  trial_timeout_minutes: 120
  failed_score: -1.0
  sampler: tpe
  sampler_seed: 42
  startup_trials: 2
  pruner: none
  objective_metric: val_accuracy
  enqueue_current_template: true
  env:
    ANKLE_DISABLE_FUSION_CROSS_VIEW_MIXER: 1
    ANKLE_DECISION_TRAIN_DOMINANT_GATE_DROPOUT_PROB: 0.25
    ANKLE_DECISION_TRAIN_NONDOMINANT_WEIGHT_FLOOR: 0.05
    ANKLE_DECISION_TRAIN_AXIAL_TOP12_MARGIN_THRESHOLD: 0.7

python_candidates:
  - .venv/bin/python
  - .venv/Scripts/python.exe

search_space:
  model.freeze_layers:
    type: categorical
    choices: [3]
  train.lr:
    type: categorical
    choices: [7.5e-5, 1.0e-4, 1.25e-4]
  train.weight_decay:
    type: categorical
    choices: [2.5e-4, 5.0e-4, 7.5e-4]
  model.dropout:
    type: categorical
    choices: [0.2, 0.25, 0.3]
  train.gradient_clip_norm:
    type: categorical
    choices: [1.5, 2.0, 2.5]
