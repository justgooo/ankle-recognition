study:
  name: dfr77_detached_consensus_candidate_gate_seed42_main
  phase: main
  base_config: configs/autoresearch_formal.yaml
  study_root: runs/optuna_main_autoloop/iter_0004_20260512_042419
  direction: maximize
  n_trials: 3
  timeout_minutes: 360
  trial_timeout_minutes: 180
  failed_score: -1.0
  sampler: tpe
  sampler_seed: 42
  startup_trials: 3
  pruner: none
  objective_metric: val_accuracy
  enqueue_current_template: false
  enqueue_trials:
  - params:
      seed: 42
      runtime_env.ANKLE_DECISION_CANDIDATE_VIEW_GATE_RESIDUAL_LIMIT: '0.35'
  - params:
      seed: 42
      runtime_env.ANKLE_DECISION_CANDIDATE_VIEW_GATE_RESIDUAL_LIMIT: '0.50'
  - params:
      seed: 42
      runtime_env.ANKLE_DECISION_CANDIDATE_VIEW_GATE_RESIDUAL_LIMIT: '0.65'
python_candidates:
- .venv/bin/python
- .venv/Scripts/python.exe
fixed_overrides:
  data.image_size: 256
  data.num_slices_per_view: 8
  data.trim_edge_slices: 2
  data.batch_size: 6
  data.num_workers: 12
  model.backbone: resnext
  model.fusion_type: decision
  model.share_backbone: false
  model.use_pretrained: true
  model.freeze_layers: 3
  model.fusion_hidden_dim: 256
  model.dropout: 0.25
  model.use_attention_pooling: false
  model.equal_weight_fusion: false
  train.epochs: 15
  train.lr: 0.0001
  train.weight_decay: 0.00025
  train.class_weight: true
  train.augmentation: true
  train.scheduler: none
  train.label_smoothing: 0.0
  train.gradient_clip_norm: 2.5
search_space:
  seed:
    type: categorical
    choices:
    - 42
  runtime_env.ANKLE_DECISION_CANDIDATE_VIEW_GATE_RESIDUAL_LIMIT:
    type: categorical
    choices:
    - '0.35'
    - '0.50'
    - '0.65'
env:
  ANKLE_DECISION_ENABLE_CANDIDATE_VIEW_GATE: '1'
  ANKLE_DECISION_CANDIDATE_VIEW_GATE_DETACH_FEATURES: '1'
  ANKLE_DECISION_CANDIDATE_VIEW_GATE_MARGIN_GAP: '0.5'
  ANKLE_DECISION_CANDIDATE_VIEW_GATE_MARGIN_WINDOW: '0.25'
  ANKLE_DECISION_CANDIDATE_VIEW_GATE_REQUIRE_CLASS_CONSENSUS: '1'
  ANKLE_DECISION_CANDIDATE_VIEW_GATE_CONSENSUS_MARGIN: '0.35'
  ANKLE_DECISION_CANDIDATE_VIEW_GATE_CONSENSUS_WINDOW: '0.20'
