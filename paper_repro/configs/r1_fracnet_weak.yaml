inherit_from: base_proxy.yaml
experiment_name: r1_fracnet_weak
output_dir: runs/paper_repro/r1_fracnet_weak
paper:
  id: R1
  title: R1 FracNet weak dense aggregation
  source_doc: docs/R_papers_ankle_ct_binary_comparison.md
  reproduction_level: task_adapted
data:
  batch_size: 2
  image_size: 192
  num_slices_per_view: 16
model:
  family: r1_fracnet_weak
  patch_size: [8, 64, 64]
  patch_stride: [4, 48, 48]
  max_patches_per_view: 6
  roi_threshold: 0.55
  roi_margin: [1, 12, 12]
  voxel_topk_fraction: 0.05
  patch_topk_fraction: 0.25
  majority_temperature: 12.0
  base_channels: 8
train:
  loss: ce_focal
