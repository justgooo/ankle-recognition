experiment_name: paper_baseline_multiview_ct
output_dir: runs/paper_baseline_multiview_ct
seed: 42

data:
  csv_path: data/demo/metadata.csv
  base_dir: .
  image_size: 224
  num_slices_per_view: 16
  batch_size: 4
  num_workers: 0
  val_ratio: 0.2
  hu_min: -1000
  hu_max: 2000

model:
  backbone: resnet18
  fusion_type: feature
  share_backbone: true
  use_pretrained: false
  fusion_hidden_dim: 256
  dropout: 0.3

train:
  epochs: 10
  lr: 0.0001
  weight_decay: 0.0001
  class_weight: true
  device: auto
