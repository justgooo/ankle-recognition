# Direct single-run confirmation of the best 256x8 ResNeXt decision-fusion recipe
# from 7ae19a0, with geometry scaled to 512x16 and trim_edge_slices=2.
experiment_name: cmp_resnext_decision_confirm_7ae19a0_512x16_b6_nw12
output_dir: runs/cmp_resnext_decision_confirm_7ae19a0_512x16_b6_nw12
seed: 42

data:
  csv_path: data/realdata/metadata.csv
  base_dir: .
  image_size: 512
  num_slices_per_view: 16
  trim_edge_slices: 2
  batch_size: 6
  num_workers: 12
  val_ratio: 0.25
  hu_min: -1000
  hu_max: 1000

model:
  backbone: resnext
  fusion_type: decision
  share_backbone: false
  use_pretrained: true
  freeze_layers: 3
  fusion_hidden_dim: 256
  dropout: 0.25
  use_attention_pooling: false

train:
  epochs: 15
  lr: 0.0001
  weight_decay: 0.0005
  class_weight: true
  device: auto
  augmentation: true
  scheduler: none
  label_smoothing: 0.0
  gradient_clip_norm: 2.0
