study:
  name: fusion_ratio_resnext_equal_prior025_seed42_main
  phase: main
  base_config: configs/autoresearch_formal.yaml
  study_root: runs/optuna_main
  direction: maximize
  n_trials: 1
  timeout_minutes: 240
  trial_timeout_minutes: 190
  failed_score: -1.0
  sampler: tpe
  sampler_seed: 42
  startup_trials: 1
  pruner: none
  objective_metric: val_accuracy
  enqueue_current_template: false

python_candidates:
  - .venv/bin/python
  - .venv/Scripts/python.exe

fixed_overrides:
  data.image_size: 512
  data.num_slices_per_view: 16
  data.trim_edge_slices: 2
  data.batch_size: 2
  data.num_workers: 4
  model.backbone: resnext
  model.fusion_type: decision
  model.share_backbone: false
  model.use_pretrained: true
  model.freeze_layers: 3
  model.fusion_hidden_dim: 256
  model.dropout: 0.3
  model.use_attention_pooling: false
  model.equal_weight_fusion: false
  train.epochs: 20
  train.lr: 1.0e-4
  train.weight_decay: 1.0e-4
  train.class_weight: true
  train.augmentation: true
  train.scheduler: none
  train.label_smoothing: 0.0
  train.gradient_clip_norm: 1.0
  train.early_stopping_patience: null

search_space:
  seed:
    type: categorical
    choices: [42]
