study:
  name: autoresearch_dfr51_evidence_close_prior_debias_main
  phase: main
  base_config: configs/autoresearch_formal.yaml
  study_root: runs/optuna_main_dfr51_evidence_close_prior_debias
  direction: maximize
  n_trials: 1
  timeout_minutes: 240
  trial_timeout_minutes: 120
  failed_score: -1.0
  sampler: tpe
  sampler_seed: 42
  startup_trials: 1
  pruner: none
  objective_metric: val_accuracy
  enqueue_current_template: false
  env:
    ANKLE_DISABLE_FUSION_CROSS_VIEW_MIXER: 1
    ANKLE_DECISION_TRAIN_DOMINANT_GATE_DROPOUT_PROB: 0.25
    ANKLE_DECISION_ENABLE_GATE_VIEW_PRIOR_DEBIAS: 1
    ANKLE_DECISION_GATE_VIEW_PRIOR_DEBIAS_STRENGTH: 0.35
    ANKLE_DECISION_GATE_VIEW_PRIOR_DEBIAS_MAX_STRENGTH: 1.0
    ANKLE_DECISION_GATE_VIEW_PRIOR_DEBIAS_MOMENTUM: 0.1
    ANKLE_DECISION_GATE_VIEW_PRIOR_DEBIAS_EVIDENCE_CLOSE_GAP: 0.2
    ANKLE_DECISION_GATE_VIEW_PRIOR_DEBIAS_EVIDENCE_CLOSE_WINDOW: 0.2

python_candidates:
  - .venv/bin/python
  - .venv/Scripts/python.exe

fixed_overrides:
  seed: 42
  data.image_size: 256
  data.num_slices_per_view: 8
  data.trim_edge_slices: 2
  data.batch_size: 6
  data.num_workers: 12
  model.backbone: resnext
  model.fusion_type: decision
  model.share_backbone: false
  model.use_pretrained: true
  model.freeze_layers: 3
  model.fusion_hidden_dim: 256
  model.dropout: 0.25
  model.use_attention_pooling: false
  model.equal_weight_fusion: false
  train.epochs: 15
  train.lr: 1.0e-4
  train.weight_decay: 2.5e-4
  train.class_weight: true
  train.augmentation: true
  train.scheduler: none
  train.label_smoothing: 0.0
  train.gradient_clip_norm: 2.5

search_space: {}
