study:
  name: autoresearch_resnext_feature_gated_256x8_main
  phase: main
  base_config: configs/autoresearch_formal.yaml
  study_root: runs/optuna_main_resnext_feature_gated_256x8
  direction: maximize
  n_trials: 3
  timeout_minutes: 360
  trial_timeout_minutes: 120
  failed_score: -1.0
  sampler: tpe
  sampler_seed: 42
  startup_trials: 3
  pruner: none
  objective_metric: val_accuracy
  enqueue_current_template: false
  tail_fill: never
  env:
    ANKLE_FEATURE_ENABLE_XVIEW_IDENTITY_SKIP_GATE: "1"
    ANKLE_FEATURE_XVIEW_IDENTITY_SKIP_MAX_SCALE: "0.25"
    ANKLE_FEATURE_XVIEW_IDENTITY_SKIP_NORMALIZE_GATE_INPUT: "1"
    ANKLE_FEATURE_XVIEW_IDENTITY_SKIP_INCLUDE_MIXED_CONTEXT: "1"
  enqueue_trials:
    - params:
        seed: 42
      description: feature_fusion_seed42
    - params:
        seed: 123
      description: feature_fusion_seed123
    - params:
        seed: 456
      description: feature_fusion_seed456
python_candidates:
  - .venv/bin/python
  - .venv/Scripts/python.exe

fixed_overrides:
  data.image_size: 256
  data.num_slices_per_view: 8
  data.trim_edge_slices: 2
  data.batch_size: 6
  data.num_workers: 12
  model.backbone: resnext
  model.fusion_type: feature
  model.share_backbone: false
  model.use_pretrained: true
  model.freeze_layers: 3
  model.fusion_hidden_dim: 256
  model.dropout: 0.25
  model.use_attention_pooling: false
  model.minimal_fusion_baseline: false
  train.epochs: 15
  train.lr: 1.0e-4
  train.weight_decay: 1.0e-4
  train.class_weight: true
  train.augmentation: true
  train.scheduler: none
  train.label_smoothing: 0.0
  train.gradient_clip_norm: 1.0

search_space:
  seed:
    type: categorical
    choices: [42, 123, 456]
