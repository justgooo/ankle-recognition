study:
  name: autoresearch_main_tuning
  phase: main
  base_config: configs/autoresearch_formal.yaml
  study_root: runs/optuna_main
  direction: maximize
  n_trials: 6
  timeout_minutes: 900
  trial_timeout_minutes: 190
  failed_score: -1.0
  sampler: tpe
  sampler_seed: 42
  startup_trials: 2
  pruner: none
  objective_metric: val_accuracy
  enqueue_current_template: true

python_candidates:
  - .venv/bin/python
  - .venv/Scripts/python.exe
  - python3
  - python

fixed_overrides:
  model.freeze_layers: 3

search_space:
  train.lr:
    type: float
    low: 4.0e-5
    high: 8.0e-5
    log: true
  train.weight_decay:
    type: categorical
    choices: [1.0e-4, 5.0e-4, 1.0e-3]
  model.dropout:
    type: categorical
    choices: [0.25, 0.3, 0.35]
  train.gradient_clip_norm:
    type: categorical
    choices: [0.5, 1.0, 2.0]
  train.label_smoothing:
    type: categorical
    choices: [0.0, 0.02]
  train.augmentation:
    type: categorical
    choices: [true]
  train.scheduler:
    type: categorical
    choices: ["none", "cosine"]
  train.scheduler_t_max:
    type: categorical
    choices: [10, 15]
    condition:
      train.scheduler: ["cosine"]
  train.early_stopping_patience:
    type: categorical
    choices: [null, 4, 6]
  data.batch_size:
    type: categorical
    choices: [2, 4]
