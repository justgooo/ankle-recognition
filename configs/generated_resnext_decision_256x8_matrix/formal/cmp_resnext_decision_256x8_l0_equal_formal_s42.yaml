experiment_name: cmp_resnext_decision_256x8_l0_equal_formal_s42
output_dir: runs/resnext_decision_256x8_matrix/formal/l0_equal/s42
seed: 42
data:
  csv_path: data/realdata/metadata.csv
  base_dir: .
  image_size: 256
  num_slices_per_view: 8
  trim_edge_slices: 2
  batch_size: 6
  num_workers: 12
  val_ratio: 0.25
  hu_min: -1000
  hu_max: 1000
model:
  backbone: resnext
  fusion_type: decision
  share_backbone: false
  use_pretrained: true
  freeze_layers: 3
  fusion_hidden_dim: 256
  dropout: 0.25
  use_attention_pooling: false
  equal_weight_fusion: true
train:
  epochs: 15
  lr: 0.0001
  weight_decay: 0.0005
  class_weight: true
  device: auto
  augmentation: true
  scheduler: none
  label_smoothing: 0.0
  gradient_clip_norm: 2.0
