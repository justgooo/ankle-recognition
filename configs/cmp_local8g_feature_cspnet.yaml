# Local 8 GB backbone comparison config: CSPNet.
experiment_name: cmp_local8g_feature_cspnet
output_dir: runs/cmp_local8g_feature_cspnet
seed: 42

data:
  csv_path: autoresearch_logs/local_metadata_fixed.csv
  base_dir: .
  image_size: 256
  num_slices_per_view: 8
  trim_edge_slices: 1
  batch_size: 2
  num_workers: 0
  val_ratio: 0.25
  hu_min: -1000
  hu_max: 1000

model:
  backbone: cspnet
  fusion_type: feature
  share_backbone: false
  use_pretrained: true
  freeze_layers: 3
  fusion_hidden_dim: 256
  dropout: 0.3
  use_attention_pooling: false

train:
  epochs: 1
  lr: 0.00005
  weight_decay: 0.0001
  class_weight: true
  device: auto
  augmentation: true
  label_smoothing: 0.0
  gradient_clip_norm: 1.0
