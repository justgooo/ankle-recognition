# DFR-61: DFR-60 view-role routing plus a bounded evidence-margin residual
# on the final binary fusion margin. The residual is zero-initialized and reads
# detached per-view logits/weights, so it starts exactly as DFR-60.
experiment_name: cmp_resnext_decision_256x8_dfr61_evidence_margin_residual_fusion_formal_s456
output_dir: runs/resnext_decision_256x8_mainline/dfr61_evidence_margin_residual_fusion_formal_s456
seed: 456

runtime_env:
  ANKLE_DISABLE_FUSION_CROSS_VIEW_MIXER: "1"
  ANKLE_DECISION_TRAIN_DOMINANT_GATE_DROPOUT_PROB: "0.25"
  ANKLE_DECISION_USE_VIEW_ROLE_CONFIDENCE_HEAD: "1"
  ANKLE_DECISION_DETACH_VIEW_ROLE_GATE_FEATURES: "1"
  ANKLE_DECISION_VIEW_ROLE_CONFIDENCE_ROLE_DIM: "32"
  ANKLE_DECISION_VIEW_ROLE_CONFIDENCE_HIDDEN_DIM: "128"
  ANKLE_DECISION_VIEW_ROLE_CONFIDENCE_DROPOUT: "0.05"
  ANKLE_DECISION_VIEW_ROLE_CONFIDENCE_LOGIT_LIMIT: "1.5"
  ANKLE_DECISION_ENABLE_EVIDENCE_MARGIN_RESIDUAL_FUSION: "1"
  ANKLE_DECISION_EVIDENCE_MARGIN_RESIDUAL_HIDDEN_DIM: "48"
  ANKLE_DECISION_EVIDENCE_MARGIN_RESIDUAL_LIMIT: "1.5"
  ANKLE_DECISION_EVIDENCE_MARGIN_RESIDUAL_DROPOUT: "0.05"

data:
  csv_path: data/realdata/metadata.csv
  base_dir: .
  image_size: 256
  num_slices_per_view: 8
  trim_edge_slices: 2
  batch_size: 6
  num_workers: 12
  val_ratio: 0.25
  hu_min: -1000
  hu_max: 1000

model:
  backbone: resnext
  fusion_type: decision
  share_backbone: false
  use_pretrained: true
  freeze_layers: 3
  fusion_hidden_dim: 256
  dropout: 0.25
  use_attention_pooling: false

train:
  epochs: 15
  lr: 1.0e-4
  weight_decay: 2.5e-4
  class_weight: true
  device: auto
  augmentation: true
  scheduler: none
  label_smoothing: 0.0
  gradient_clip_norm: 2.5
