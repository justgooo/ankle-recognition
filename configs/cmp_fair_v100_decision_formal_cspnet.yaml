# Fair backbone compare, V100-oriented formal budget.
# Mirrors the old matched backbone recipe but switches to decision fusion
# and uses the user-requested worker setting for this rerun.
experiment_name: cmp_fair_v100_decision_formal_cspnet
output_dir: runs/cmp_fair_v100_decision_formal_cspnet
seed: 42

data:
  csv_path: data/realdata/metadata.csv
  base_dir: .
  image_size: 256
  num_slices_per_view: 8
  trim_edge_slices: 1
  batch_size: 6
  num_workers: 4
  val_ratio: 0.25
  hu_min: -1000
  hu_max: 1000

model:
  backbone: cspnet
  fusion_type: decision
  share_backbone: false
  use_pretrained: true
  freeze_layers: 3
  fusion_hidden_dim: 256
  dropout: 0.3
  use_attention_pooling: false

train:
  epochs: 15
  lr: 0.0001
  weight_decay: 0.0001
  class_weight: true
  device: auto
  augmentation: true
  scheduler: none
  label_smoothing: 0.0
  gradient_clip_norm: 1.0
