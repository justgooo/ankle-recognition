study:
  name: autoresearch_proxy_tuning_constrained
  phase: proxy
  base_config: configs/autoresearch_proxy.yaml
  study_root: runs/optuna_proxy_constrained
  direction: maximize
  n_trials: 8
  timeout_minutes: 240
  trial_timeout_minutes: 70
  failed_score: -1.0
  sampler: tpe
  sampler_seed: 42
  startup_trials: 2
  pruner: none
  objective_metric: val_accuracy
  enqueue_current_template: true

python_candidates:
  - .venv/bin/python
  - .venv/Scripts/python.exe
  - python3
  - python

fixed_overrides:
  model.freeze_layers: 3
  train.weight_decay: 0.001
  model.dropout: 0.3
  train.gradient_clip_norm: 1.0
  train.label_smoothing: 0.0
  train.scheduler: none
  data.batch_size: 4

search_space:
  train.lr:
    type: float
    low: 4.0e-5
    high: 6.0e-5
    step: 5.0e-6
  train.augmentation:
    type: categorical
    choices: [true, false]
  train.early_stopping_patience:
    type: categorical
    choices: [2, 3]
