# Decision-fusion mainline repair DFR-11.
# Keep L3-no-mixer fixed and add only per-view global logit temperature calibration.
experiment_name: cmp_resnext_decision_256x8_dfr11_view_logit_temperature_formal_s42
output_dir: runs/resnext_decision_256x8_mainline/dfr11_view_logit_temperature_formal_s42
seed: 42

runtime_env:
  ANKLE_DISABLE_FUSION_CROSS_VIEW_MIXER: "1"
  ANKLE_DECISION_ENABLE_VIEW_LOGIT_TEMPERATURE: "1"

data:
  csv_path: data/realdata/metadata.csv
  base_dir: .
  image_size: 256
  num_slices_per_view: 8
  trim_edge_slices: 2
  batch_size: 6
  num_workers: 12
  val_ratio: 0.25
  hu_min: -1000
  hu_max: 1000

model:
  backbone: resnext
  fusion_type: decision
  share_backbone: false
  use_pretrained: true
  freeze_layers: 3
  fusion_hidden_dim: 256
  dropout: 0.25
  use_attention_pooling: false

train:
  epochs: 15
  lr: 1.0e-4
  weight_decay: 5.0e-4
  class_weight: true
  device: auto
  augmentation: true
  scheduler: none
  label_smoothing: 0.0
  gradient_clip_norm: 2.0
