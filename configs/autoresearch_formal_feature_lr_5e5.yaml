experiment_name: autoresearch_formal_feature_lr_5e5
output_dir: runs/autoresearch_formal_feature_lr_5e5
seed: 42

data:
  csv_path: data/realdata/metadata.csv
  base_dir: .
  image_size: 256
  num_slices_per_view: 32
  trim_edge_slices: 1
  batch_size: 4
  num_workers: 1
  val_ratio: 0.25
  hu_min: -1000
  hu_max: 1000

model:
  backbone: resnet18
  fusion_type: feature
  share_backbone: true
  use_pretrained: true
  fusion_hidden_dim: 256
  dropout: 0.3

train:
  epochs: 10
  lr: 0.00005
  weight_decay: 0.0001
  class_weight: true
  device: auto
