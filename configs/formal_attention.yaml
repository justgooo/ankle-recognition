# Formal comparison: Attention Fusion
# Same training strategy as the best Decision Fusion formal (d63b49a)
# Note: Attention Fusion uses its own attention pooling + cross-view attention;
# freeze_layers is NOT applied (MultiViewAttentionClassifier has its own backbone init)
experiment_name: formal_attention
output_dir: runs/formal_attention
seed: 42

data:
  csv_path: data/realdata/metadata.csv
  base_dir: .
  image_size: 192
  num_slices_per_view: 16
  trim_edge_slices: 1
  batch_size: 2
  num_workers: 0
  val_ratio: 0.25
  hu_min: -1000
  hu_max: 1000

model:
  backbone: resnet18
  fusion_type: attention
  share_backbone: false
  use_pretrained: true
  fusion_hidden_dim: 256
  dropout: 0.3
  cross_view_heads: 4
  cross_view_layers: 2

train:
  epochs: 15
  lr: 0.00005
  weight_decay: 0.0001
  class_weight: true
  device: auto
  augmentation: true
  label_smoothing: 0.0
  gradient_clip_norm: 1.0
