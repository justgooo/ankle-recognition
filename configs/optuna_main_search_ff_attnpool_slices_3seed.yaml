study:
  name: autoresearch_ff_attnpool_slices_3seed
  phase: main
  base_config: configs/autoresearch_formal_ff_attnpool_slices_base.yaml
  study_root: runs/optuna_main_ff_attnpool_slices_3seed
  direction: maximize
  n_trials: 12
  timeout_minutes: 720
  trial_timeout_minutes: 180
  failed_score: -1.0
  sampler: random
  sampler_seed: 42
  startup_trials: 12
  pruner: none
  objective_metric: val_accuracy
  enqueue_current_template: false
  tail_fill: never
  enqueue_trials:
    - params:
        seed: 42
        data.num_slices_per_view: 8
      description: attnpool_s8_seed42
    - params:
        seed: 123
        data.num_slices_per_view: 8
      description: attnpool_s8_seed123
    - params:
        seed: 456
        data.num_slices_per_view: 8
      description: attnpool_s8_seed456
    - params:
        seed: 42
        data.num_slices_per_view: 12
      description: attnpool_s12_seed42
    - params:
        seed: 123
        data.num_slices_per_view: 12
      description: attnpool_s12_seed123
    - params:
        seed: 456
        data.num_slices_per_view: 12
      description: attnpool_s12_seed456
    - params:
        seed: 42
        data.num_slices_per_view: 16
      description: attnpool_s16_seed42
    - params:
        seed: 123
        data.num_slices_per_view: 16
      description: attnpool_s16_seed123
    - params:
        seed: 456
        data.num_slices_per_view: 16
      description: attnpool_s16_seed456
    - params:
        seed: 42
        data.num_slices_per_view: 20
      description: attnpool_s20_seed42
    - params:
        seed: 123
        data.num_slices_per_view: 20
      description: attnpool_s20_seed123
    - params:
        seed: 456
        data.num_slices_per_view: 20
      description: attnpool_s20_seed456

python_candidates:
  - .venv/bin/python
  - .venv/Scripts/python.exe

fixed_overrides:
  data.image_size: 256
  data.trim_edge_slices: 2
  data.batch_size: 6
  data.num_workers: 12
  model.backbone: resnext
  model.fusion_type: feature
  model.share_backbone: false
  model.use_pretrained: true
  model.freeze_layers: 3
  model.fusion_hidden_dim: 256
  model.dropout: 0.25
  model.use_attention_pooling: true
  model.minimal_fusion_baseline: false
  train.epochs: 15
  train.lr: 1.0e-4
  train.weight_decay: 1.0e-4
  train.class_weight: true
  train.augmentation: true
  train.scheduler: none
  train.label_smoothing: 0.0
  train.gradient_clip_norm: 1.0

search_space:
  seed:
    type: categorical
    choices: [42, 123, 456]
  data.num_slices_per_view:
    type: categorical
    choices: [8, 12, 16, 20]
