experiment_name: realdata_attention_fixedsplit_nonshared
output_dir: runs/realdata_attention_fixedsplit_nonshared
seed: 42

data:
  csv_path: data/realdata/metadata.csv
  base_dir: .
  image_size: 256
  num_slices_per_view: 32
  trim_edge_slices: 1
  batch_size: 4
  num_workers: 1
  val_ratio: 0.25
  test_ratio: 0.05053191489361702
  use_existing_split: true
  hu_min: -1000
  hu_max: 1000

model:
  backbone: resnet18
  fusion_type: attention
  share_backbone: false
  use_pretrained: true
  fusion_hidden_dim: 256
  dropout: 0.3
  cross_view_heads: 8
  cross_view_layers: 2
  attention_output_view: 3

train:
  epochs: 10
  lr: 0.0001
  weight_decay: 0.0001
  class_weight: true
  device: auto
