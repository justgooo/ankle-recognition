# Minimal ResNeXt feature-fusion comparison.
# Keep geometry/training matched to the decision compare config and avoid
# extra fusion modules so the main variable is fusion semantics itself.
experiment_name: cmp_resnext_feature_minimal_512_b8_e15_nw2
output_dir: runs/cmp_resnext_feature_minimal_512_b8_e15_nw2
seed: 42

data:
  csv_path: data/realdata/metadata.csv
  base_dir: .
  image_size: 512
  num_slices_per_view: 16
  trim_edge_slices: 2
  batch_size: 8
  num_workers: 2
  val_ratio: 0.25
  hu_min: -1000
  hu_max: 1000

model:
  backbone: resnext
  fusion_type: feature
  minimal_fusion_baseline: true
  share_backbone: false
  use_pretrained: true
  freeze_layers: 3
  fusion_hidden_dim: 256
  dropout: 0.3
  use_attention_pooling: false

train:
  epochs: 15
  lr: 5.0e-5
  weight_decay: 1.0e-4
  class_weight: true
  device: auto
  augmentation: true
  scheduler: none
  label_smoothing: 0.0
  gradient_clip_norm: 1.0
