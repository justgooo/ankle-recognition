study:
  name: autoresearch_resnext_decision_256x8_dfr74_mismatch_3seed_main
  phase: main
  base_config: configs/autoresearch_formal.yaml
  study_root: runs/optuna_main_resnext_decision_256x8_3seed
  direction: maximize
  n_trials: 3
  timeout_minutes: 360
  trial_timeout_minutes: 180
  failed_score: -1.0
  sampler: tpe
  sampler_seed: 42
  startup_trials: 3
  pruner: none
  objective_metric: val_accuracy
  enqueue_current_template: false
  enqueue_trials:
    - params:
        seed: 42
    - params:
        seed: 123
    - params:
        seed: 456
  env:
    ANKLE_DECISION_TRAIN_AXIAL_TEACHER_MISALIGNMENT_THRESHOLD: "0.1"

python_candidates:
  - .venv/bin/python
  - .venv/Scripts/python.exe

fixed_overrides:
  data.image_size: 256
  data.num_slices_per_view: 8
  data.trim_edge_slices: 2
  data.batch_size: 6
  data.num_workers: 12
  model.backbone: resnext
  model.fusion_type: decision
  model.share_backbone: false
  model.use_pretrained: true
  model.freeze_layers: 3
  model.fusion_hidden_dim: 256
  model.dropout: 0.25
  model.use_attention_pooling: false
  model.equal_weight_fusion: false
  train.epochs: 15
  train.lr: 1.0e-4
  train.weight_decay: 2.5e-4
  train.class_weight: true
  train.augmentation: true
  train.scheduler: none
  train.label_smoothing: 0.0
  train.gradient_clip_norm: 2.5

search_space:
  seed:
    type: categorical
    choices: [42, 123, 456]
