# Fast proxy config for the current main autoresearch lane.
# Human-directed mainline anchor: ResNeXt 256x8 feature-fusion gated head.
# Shortens only the epoch budget for smoke tests.
experiment_name: autoresearch_proxy_resnext_feature_gated_256x8
output_dir: runs/autoresearch_proxy_resnext_feature_gated_256x8
seed: 42

data:
  csv_path: data/realdata/metadata.csv
  base_dir: .
  image_size: 256
  num_slices_per_view: 8
  trim_edge_slices: 2
  batch_size: 6
  num_workers: 12
  val_ratio: 0.25
  hu_min: -1000
  hu_max: 1000

model:
  backbone: resnext
  fusion_type: feature
  share_backbone: false
  use_pretrained: true
  freeze_layers: 3
  fusion_hidden_dim: 256
  dropout: 0.25
  use_attention_pooling: false
  minimal_fusion_baseline: false

train:
  epochs: 4
  lr: 1.0e-4
  weight_decay: 1.0e-4
  class_weight: true
  device: auto
  augmentation: true
  scheduler: none
  label_smoothing: 0.0
  gradient_clip_norm: 1.0
