# Fast proxy config for local 8 GB GPUs such as RTX 2070 SUPER.
# Keeps the current ResUNet + AttentionPooling + VRG decision-fusion path,
# but trims geometry so proxy runs stay within the local memory budget.
experiment_name: autoresearch_proxy
output_dir: runs/autoresearch_proxy
seed: 42

data:
  csv_path: autoresearch_logs/local_metadata_fixed.csv
  base_dir: .
  image_size: 256
  num_slices_per_view: 8
  trim_edge_slices: 1
  batch_size: 2
  num_workers: 0
  val_ratio: 0.25
  hu_min: -1000
  hu_max: 1000

model:
  backbone: resunet       # ResUNet + Attention Gate backbone
  fusion_type: decision   # Decision Fusion = VRG variant
  share_backbone: false
  use_pretrained: true
  freeze_layers: 3
  fusion_hidden_dim: 256
  dropout: 0.3
  use_attention_pooling: true  # AttentionPooling 聚合切片特征

train:
  epochs: 4
  lr: 0.00005
  weight_decay: 0.001
  class_weight: true
  device: auto
  augmentation: true
  scheduler: none
  label_smoothing: 0.0
  gradient_clip_norm: 1.0
  early_stopping_patience: 2
