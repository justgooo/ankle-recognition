# Fast proxy config for autoresearch-style iteration.
# Experiment: Asymmetric Safety-Biased Fusion (Scheme 6) baseline.
experiment_name: autoresearch_proxy
output_dir: runs/autoresearch_proxy
seed: 42

data:
  csv_path: data/realdata/metadata.csv
  base_dir: .
  image_size: 192
  num_slices_per_view: 16
  trim_edge_slices: 1
  batch_size: 2
  num_workers: 0
  val_ratio: 0.25
  hu_min: -1000
  hu_max: 1000

model:
  backbone: resnet18
  fusion_type: decision
  share_backbone: false
  use_pretrained: true
  fusion_hidden_dim: 256
  dropout: 0.3

train:
  epochs: 4
  lr: 0.0001
  weight_decay: 0.0001
  class_weight: true
  device: auto
  augmentation: true
  label_smoothing: 0.0
