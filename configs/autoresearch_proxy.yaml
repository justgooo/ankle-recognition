# Fast proxy config for autoresearch-style iteration.
# Stage 3 formal-comparison prep: Attention Fusion proxy gate
# using the historical best attention recipe as the paper-compare candidate.
experiment_name: autoresearch_proxy
output_dir: runs/autoresearch_proxy
seed: 42

data:
  csv_path: data/realdata/metadata.csv
  base_dir: .
  image_size: 192
  num_slices_per_view: 16
  trim_edge_slices: 1
  batch_size: 2
  num_workers: 0
  val_ratio: 0.25
  hu_min: -1000
  hu_max: 1000

model:
  backbone: resnet18
  fusion_type: attention  # Attention Fusion candidate for Stage 3 formal compare
  share_backbone: true
  use_pretrained: true
  fusion_hidden_dim: 256
  dropout: 0.3
  cross_view_heads: 4
  cross_view_layers: 2

train:
  epochs: 4
  lr: 0.0001
  weight_decay: 0.0001
  class_weight: true
  device: auto
  augmentation: false
  label_smoothing: 0.0
