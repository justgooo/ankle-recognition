# Formal comparison: Feature Fusion with freeze=3 + LayerNorm baseline
# Same training strategy as the best Decision Fusion formal (d63b49a)
experiment_name: formal_feature
output_dir: runs/formal_feature
seed: 42

data:
  csv_path: data/realdata/metadata.csv
  base_dir: .
  image_size: 512
  num_slices_per_view: 16
  trim_edge_slices: 1
  batch_size: 4
  num_workers: 1
  val_ratio: 0.25
  hu_min: -1000
  hu_max: 1000

model:
  backbone: resnet18
  fusion_type: feature
  share_backbone: false
  use_pretrained: true
  fusion_hidden_dim: 256
  dropout: 0.3
  use_attention_pooling: false

train:
  epochs: 15
  lr: 0.00005
  weight_decay: 0.0001
  class_weight: true
  device: auto
  augmentation: true
  label_smoothing: 0.0
  gradient_clip_norm: 1.0
