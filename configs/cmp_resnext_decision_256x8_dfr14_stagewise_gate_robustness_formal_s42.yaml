# Decision-fusion mainline repair DFR-14.
# Stage-wise gate fine-tuning from the L3-no-mixer checkpoint, with dominant-view robustness enabled during gate-only training.
experiment_name: cmp_resnext_decision_256x8_dfr14_stagewise_gate_robustness_formal_s42
output_dir: runs/resnext_decision_256x8_mainline/dfr14_stagewise_gate_robustness_formal_s42
seed: 42

runtime_env:
  ANKLE_DISABLE_FUSION_CROSS_VIEW_MIXER: "1"
  ANKLE_DECISION_TRAIN_VIEW_DROPOUT_PROB: "0.15"
  ANKLE_DECISION_TRAIN_AXIAL_BLUR_PROB: "0.30"
  ANKLE_DECISION_TRAIN_AXIAL_BLUR_KERNEL: "9"

data:
  csv_path: data/realdata/metadata.csv
  base_dir: .
  image_size: 256
  num_slices_per_view: 8
  trim_edge_slices: 2
  batch_size: 6
  num_workers: 12
  val_ratio: 0.25
  hu_min: -1000
  hu_max: 1000

model:
  backbone: resnext
  fusion_type: decision
  share_backbone: false
  use_pretrained: true
  freeze_layers: 3
  fusion_hidden_dim: 256
  dropout: 0.25
  use_attention_pooling: false

train:
  epochs: 10
  lr: 1.0e-4
  weight_decay: 5.0e-4
  class_weight: true
  device: auto
  augmentation: true
  scheduler: none
  label_smoothing: 0.0
  gradient_clip_norm: 2.0
  early_stopping_patience: 4

stagewise:
  init_checkpoint: runs/resnext_decision_256x8_matrix/formal/l3_no_mixer/s42/best.pt
  strict_load: true
  trainable_prefixes:
    - confidence_heads
    - confidence_calibrator
