experiment_name: attention_fusion_multiview_ct
output_dir: runs/attention_fusion_multiview_ct
seed: 42

data:
  csv_path: data/demo/metadata.csv
  base_dir: .
  image_size: 128
  num_slices_per_view: 8
  batch_size: 2
  num_workers: 0
  val_ratio: 0.2
  hu_min: -1000
  hu_max: 2000

model:
  backbone: resnet18
  fusion_type: attention          # 使用注意力融合模式（Attention Pooling + Cross-View Attention）
  share_backbone: true
  use_pretrained: false
  fusion_hidden_dim: 256
  dropout: 0.3
  cross_view_heads: 8             # Cross-View Attention 的注意力头数
  cross_view_layers: 2            # Cross-View Attention 的 Transformer 层数

train:
  epochs: 3
  lr: 0.0001
  weight_decay: 0.0001
  class_weight: true
  device: auto
