study:
  name: autoresearch_resnext_decision_v100_main_tuning
  phase: main
  base_config: configs/autoresearch_formal_resnext_decision_v100.yaml
  study_root: runs/optuna_main_resnext_decision_v100
  direction: maximize
  n_trials: 4
  timeout_minutes: 480
  trial_timeout_minutes: 180
  failed_score: -1.0
  sampler: tpe
  sampler_seed: 42
  startup_trials: 2
  pruner: none
  objective_metric: val_accuracy
  enqueue_current_template: true

python_candidates:
  - .venv/bin/python
  - .venv/Scripts/python.exe

search_space:
  model.freeze_layers:
    type: categorical
    choices: [3]
  train.lr:
    type: categorical
    choices: [3.0e-5, 5.0e-5, 7.5e-5]
  train.weight_decay:
    type: categorical
    choices: [5.0e-4, 7.5e-4, 1.0e-3]
  model.dropout:
    type: categorical
    choices: [0.3, 0.35, 0.4]
  train.gradient_clip_norm:
    type: categorical
    choices: [0.5, 1.0, 1.5]
