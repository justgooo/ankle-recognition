study:
  name: autoresearch_resnext_decision_v100_main_tuning
  phase: main
  base_config: configs/autoresearch_formal_resnext_decision_v100.yaml
  study_root: runs/optuna_main_resnext_decision_v100
  direction: maximize
  n_trials: 4
  timeout_minutes: 240
  trial_timeout_minutes: 60
  failed_score: -1.0
  sampler: tpe
  sampler_seed: 42
  startup_trials: 2
  pruner: none
  objective_metric: val_accuracy
  enqueue_current_template: true

python_candidates:
  - .venv/bin/python
  - .venv/Scripts/python.exe

search_space:
  model.freeze_layers:
    type: categorical
    choices: [2, 3]
  train.lr:
    type: categorical
    choices: [5.0e-5, 7.5e-5, 1.0e-4, 1.25e-4]
  train.weight_decay:
    type: categorical
    choices: [1.0e-4, 5.0e-4]
  model.dropout:
    type: categorical
    choices: [0.25, 0.3, 0.35]
  train.gradient_clip_norm:
    type: categorical
    choices: [1.0, 2.0]
