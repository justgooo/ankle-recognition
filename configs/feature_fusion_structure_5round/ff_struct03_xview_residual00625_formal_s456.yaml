# FF-STRUCT-03-XVIEW-RESIDUAL00625-3SEED-FORMAL: Change only the CrossViewAttention residual scale from 0.125 to 0.0625 while keeping the mixer architecture, GLU head, and scalars fixed.
experiment_name: paper_feature_fusion_structure_5round_ff_struct03_xview_residual00625_s456
output_dir: runs/paper_feature_fusion/structure_5round/ff_struct03_xview_residual00625_s456
seed: 456

data:
  csv_path: data/realdata/metadata.csv
  base_dir: .
  image_size: 256
  num_slices_per_view: 8
  trim_edge_slices: 2
  batch_size: 6
  num_workers: 12
  val_ratio: 0.25
  hu_min: -1000
  hu_max: 1000

model:
  backbone: resnext
  fusion_type: feature
  share_backbone: false
  use_pretrained: true
  freeze_layers: 3
  fusion_hidden_dim: 256
  dropout: 0.25
  use_attention_pooling: false
  minimal_fusion_baseline: false

train:
  epochs: 15
  lr: 1.0e-4
  weight_decay: 1.0e-4
  class_weight: true
  device: auto
  augmentation: true
  scheduler: none
  label_smoothing: 0.0
  gradient_clip_norm: 1.0

runtime_env:
  ANKLE_FEATURE_XVIEW_RESIDUAL_SCALE: "0.0625"
