# Candidate config preserved from the training branch after syncing with main.
# Source: 2026-04-13 fresh proxy Optuna winner (trial 0) on the local training machine.
experiment_name: autoresearch_proxy_trial0_20260413
output_dir: runs/candidates/autoresearch_proxy_trial0_20260413
seed: 42

data:
  csv_path: data/realdata/metadata.csv
  base_dir: .
  image_size: 512
  num_slices_per_view: 16
  trim_edge_slices: 1
  batch_size: 4
  num_workers: 4
  val_ratio: 0.25
  hu_min: -1000
  hu_max: 1000

model:
  backbone: resunet
  fusion_type: decision
  share_backbone: false
  use_pretrained: true
  freeze_layers: 3
  fusion_hidden_dim: 256
  dropout: 0.3
  use_attention_pooling: true

train:
  epochs: 4
  lr: 0.00005
  weight_decay: 0.001
  class_weight: true
  device: auto
  augmentation: true
  label_smoothing: 0.0
  gradient_clip_norm: 1.0
