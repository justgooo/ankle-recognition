# Slower confirmation config for the current main autoresearch lane.
# Human-directed mainline: DFR-51 ResNeXt 256x8 learned decision fusion.
# DFR-51 conditionally strengthens DFR-50 prior debiasing when non-axial evidence is close.
experiment_name: autoresearch_formal_dfr51_evidence_close_prior_debias
output_dir: runs/autoresearch_formal_dfr51_evidence_close_prior_debias
seed: 42

runtime_env:
  ANKLE_DISABLE_FUSION_CROSS_VIEW_MIXER: "1"
  ANKLE_DECISION_TRAIN_DOMINANT_GATE_DROPOUT_PROB: "0.25"
  ANKLE_DECISION_ENABLE_GATE_VIEW_PRIOR_DEBIAS: "1"
  ANKLE_DECISION_GATE_VIEW_PRIOR_DEBIAS_STRENGTH: "0.35"
  ANKLE_DECISION_GATE_VIEW_PRIOR_DEBIAS_MAX_STRENGTH: "1.0"
  ANKLE_DECISION_GATE_VIEW_PRIOR_DEBIAS_MOMENTUM: "0.1"
  ANKLE_DECISION_GATE_VIEW_PRIOR_DEBIAS_EVIDENCE_CLOSE_GAP: "0.2"
  ANKLE_DECISION_GATE_VIEW_PRIOR_DEBIAS_EVIDENCE_CLOSE_WINDOW: "0.2"

data:
  csv_path: data/realdata/metadata.csv
  base_dir: .
  image_size: 256
  num_slices_per_view: 8
  trim_edge_slices: 2
  batch_size: 6
  num_workers: 12
  val_ratio: 0.25
  hu_min: -1000
  hu_max: 1000

model:
  backbone: resnext
  fusion_type: decision
  share_backbone: false
  use_pretrained: true
  freeze_layers: 3
  fusion_hidden_dim: 256
  dropout: 0.25
  use_attention_pooling: false

train:
  epochs: 15
  lr: 1.0e-4
  weight_decay: 2.5e-4
  class_weight: true
  device: auto
  augmentation: true
  scheduler: none
  label_smoothing: 0.0
  gradient_clip_norm: 2.5
