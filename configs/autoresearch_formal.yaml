# Slower confirmation config for promising proxy winners.
# Formal mirror for the Stage 8 Progressive Feature Distillation Fusion (PFDF) family.
# Current mirror: PFDF-06 label_smoothing=0.05 (lr=1e-4, dropout=0.3).
experiment_name: autoresearch_formal
output_dir: runs/autoresearch_formal
seed: 42

data:
  csv_path: data/realdata/metadata.csv
  base_dir: .
  image_size: 256
  num_slices_per_view: 32
  trim_edge_slices: 1
  batch_size: 2
  num_workers: 0
  val_ratio: 0.25
  hu_min: -1000
  hu_max: 1000

model:
  backbone: resnet18
  fusion_type: decision  # PFDF is implemented under the decision entry point.
  share_backbone: false
  use_pretrained: true
  fusion_hidden_dim: 256
  dropout: 0.3
  use_attention_pooling: false

train:
  epochs: 15
  lr: 0.0001
  weight_decay: 0.0001
  class_weight: true
  device: auto
  augmentation: true
  label_smoothing: 0.05
