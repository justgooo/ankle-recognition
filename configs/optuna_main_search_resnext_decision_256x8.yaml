study:
  name: autoresearch_resnext_decision_256x8_dfr25_main
  phase: main
  base_config: configs/autoresearch_formal_resnext_decision_256x8.yaml
  study_root: runs/optuna_main_resnext_decision_256x8_dfr25
  direction: maximize
  n_trials: 1
  timeout_minutes: 240
  trial_timeout_minutes: 120
  failed_score: -1.0
  sampler: tpe
  sampler_seed: 42
  startup_trials: 1
  pruner: none
  objective_metric: val_accuracy
  enqueue_current_template: false
  env:
    ANKLE_DISABLE_FUSION_CROSS_VIEW_MIXER: 1
    ANKLE_DECISION_TRAIN_DOMINANT_GATE_DROPOUT_PROB: 0.25

python_candidates:
  - .venv/bin/python
  - .venv/Scripts/python.exe

fixed_overrides:
  seed: 42
  model.freeze_layers: 3
  train.lr: 1.0e-4
  train.weight_decay: 2.5e-4
  model.dropout: 0.25
  train.gradient_clip_norm: 2.5

search_space: {}
