# DFR-62: DFR-60 view-role routing plus a one-way positive-evidence floor on
# the final binary margin. Unlike DFR-61, this module cannot learn a negative
# residual; it only boosts abnormal margin when detached view evidence is high.
experiment_name: cmp_resnext_decision_256x8_dfr62_positive_evidence_floor_fusion_formal_s42
output_dir: runs/resnext_decision_256x8_mainline/dfr62_positive_evidence_floor_fusion_formal_s42
seed: 42

runtime_env:
  ANKLE_DISABLE_FUSION_CROSS_VIEW_MIXER: "1"
  ANKLE_DECISION_TRAIN_DOMINANT_GATE_DROPOUT_PROB: "0.25"
  ANKLE_DECISION_USE_VIEW_ROLE_CONFIDENCE_HEAD: "1"
  ANKLE_DECISION_DETACH_VIEW_ROLE_GATE_FEATURES: "1"
  ANKLE_DECISION_VIEW_ROLE_CONFIDENCE_ROLE_DIM: "32"
  ANKLE_DECISION_VIEW_ROLE_CONFIDENCE_HIDDEN_DIM: "128"
  ANKLE_DECISION_VIEW_ROLE_CONFIDENCE_DROPOUT: "0.05"
  ANKLE_DECISION_VIEW_ROLE_CONFIDENCE_LOGIT_LIMIT: "1.5"
  ANKLE_DECISION_ENABLE_POSITIVE_EVIDENCE_FLOOR_FUSION: "1"
  ANKLE_DECISION_POSITIVE_EVIDENCE_FLOOR_HIDDEN_DIM: "48"
  ANKLE_DECISION_POSITIVE_EVIDENCE_FLOOR_RESIDUAL_LIMIT: "1.0"
  ANKLE_DECISION_POSITIVE_EVIDENCE_FLOOR_DROPOUT: "0.05"
  ANKLE_DECISION_POSITIVE_EVIDENCE_FLOOR_EVIDENCE_THRESHOLD: "0.75"
  ANKLE_DECISION_POSITIVE_EVIDENCE_FLOOR_SUPPORT_THRESHOLD: "0.2"
  ANKLE_DECISION_POSITIVE_EVIDENCE_FLOOR_FUSED_CEILING: "0.5"

data:
  csv_path: data/realdata/metadata.csv
  base_dir: .
  image_size: 256
  num_slices_per_view: 8
  trim_edge_slices: 2
  batch_size: 6
  num_workers: 12
  val_ratio: 0.25
  hu_min: -1000
  hu_max: 1000

model:
  backbone: resnext
  fusion_type: decision
  share_backbone: false
  use_pretrained: true
  freeze_layers: 3
  fusion_hidden_dim: 256
  dropout: 0.25
  use_attention_pooling: false

train:
  epochs: 15
  lr: 1.0e-4
  weight_decay: 2.5e-4
  class_weight: true
  device: auto
  augmentation: true
  scheduler: none
  label_smoothing: 0.0
  gradient_clip_norm: 2.5
