# Dedicated formal config for the ResNeXt-only V100 decision-fusion campaign.
# Keeps the required 512x16 geometry fixed and replays the latest gated
# reliability-adapter main-study winner as a direct formal confirmation.
experiment_name: autoresearch_formal_resnext_decision_v100
output_dir: runs/autoresearch_formal_resnext_decision_v100
seed: 42

data:
  csv_path: data/realdata/metadata.csv
  base_dir: .
  image_size: 512
  num_slices_per_view: 16
  trim_edge_slices: 2
  batch_size: 2
  num_workers: 12
  val_ratio: 0.25
  hu_min: -1000
  hu_max: 1000

model:
  backbone: resnext
  fusion_type: decision
  share_backbone: false
  use_pretrained: true
  freeze_layers: 3
  fusion_hidden_dim: 256
  dropout: 0.4
  use_attention_pooling: false

train:
  epochs: 30
  lr: 3.0e-5
  weight_decay: 7.5e-4
  class_weight: true
  device: auto
  augmentation: true
  scheduler: none
  label_smoothing: 0.0
  gradient_clip_norm: 2.0
