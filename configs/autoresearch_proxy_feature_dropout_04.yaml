experiment_name: autoresearch_proxy_feature_dropout_04
output_dir: runs/autoresearch_proxy_feature_dropout_04
seed: 42

data:
  csv_path: data/realdata/metadata.csv
  base_dir: .
  image_size: 512
  num_slices_per_view: 16
  trim_edge_slices: 1
  batch_size: 4
  num_workers: 0
  val_ratio: 0.25
  hu_min: -1000
  hu_max: 1000

model:
  backbone: resnet18
  fusion_type: feature
  share_backbone: true
  use_pretrained: true
  fusion_hidden_dim: 256
  dropout: 0.4

train:
  epochs: 4
  lr: 0.0001
  weight_decay: 0.0001
  class_weight: true
  device: auto
